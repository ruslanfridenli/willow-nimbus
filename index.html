<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Willow Nimbus — Pixel Forge</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>▦ willow nimbus — pixel forge</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="tools">Tools</h2><div class="btncol" id="tools"></div></section>
<section><h2 data-i="palette">Palette</h2><div class="pal" id="pal"></div>
<label class="check"><input type="checkbox" id="gridlines" checked> <span data-i="gridlines">Grid lines</span></label></section>
<section><h2 data-i="actions">Actions</h2><div class="btncol">

<button id="png" class="primary" data-i="png">⤓ Export PNG</button></div></section>
</aside><div class="stage"><canvas id="cv"></canvas></div></main>
<script src="app.js"></script></body></html>
